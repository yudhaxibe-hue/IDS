name: CI & Cross-Platform Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos-build:
    name: Test & Build (macOS Native)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Baseline Model Training
        run: |
          python -m models.training.trainer

      - name: Execute Automated Test Suite
        run: |
          pytest tests/ -v

      - name: Build macOS Application Bundle via PyInstaller
        run: |
          pyinstaller packaging/macos/ids_macos.spec --noconfirm

      - name: Create macOS Distributable Archive & Checksum
        run: |
          cd dist
          zip -r -q ExplainableAdaptiveIDS-macOS-unsigned.zip ExplainableAdaptiveIDS.app
          shasum -a 256 ExplainableAdaptiveIDS-macOS-unsigned.zip > ExplainableAdaptiveIDS-macOS.sha256
          cat ExplainableAdaptiveIDS-macOS.sha256

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExplainableAdaptiveIDS-macOS
          path: |
            dist/ExplainableAdaptiveIDS-macOS-unsigned.zip
            dist/ExplainableAdaptiveIDS-macOS.sha256

  windows-build:
    name: Test & Build (Windows Native)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Baseline Model Training
        run: |
          python -m models.training.trainer

      - name: Execute Automated Test Suite
        run: |
          pytest tests/ -v

      - name: Build Windows Application via PyInstaller
        run: |
          pyinstaller packaging/windows/ids_windows.spec --noconfirm

      - name: Create Windows Distributable Archive & Checksum
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path ExplainableAdaptiveIDS -DestinationPath ExplainableAdaptiveIDS-Windows-unsigned.zip
          $hash = (Get-FileHash ExplainableAdaptiveIDS-Windows-unsigned.zip -Algorithm SHA256).Hash
          "$hash  ExplainableAdaptiveIDS-Windows-unsigned.zip" | Out-File -Encoding ascii ExplainableAdaptiveIDS-Windows.sha256
          Get-Content ExplainableAdaptiveIDS-Windows.sha256

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExplainableAdaptiveIDS-Windows
          path: |
            dist/ExplainableAdaptiveIDS-Windows-unsigned.zip
            dist/ExplainableAdaptiveIDS-Windows.sha256
